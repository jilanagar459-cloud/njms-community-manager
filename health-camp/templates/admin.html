<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Camp — Admin</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><div class="eyebrow">ADMIN CONTROL</div><h1>Health Camp Status Manager</h1><div class="sub">27 September 2026</div></div><div><a class="link" href="/">Public Dashboard</a> <button onclick="logout()">Logout</button></div></header><main><section class="stats"><div class="stat"><span>Total</span><strong id="t">0</strong></div><div class="stat"><span>Done</span><strong id="d">0</strong></div><div class="stat"><span>In Progress</span><strong id="p">0</strong></div><div class="stat"><span>Waiting</span><strong id="w">0</strong></div></section><section class="toolbar"><input id="q" placeholder="Search registration or name"><select id="f"><option value="">All statuses</option><option>Registered</option><option>Waiting</option><option>In Progress</option><option>Completed</option><option>No Show</option></select><button onclick="load()">Search</button></section><div class="table"><table><thead><tr><th>Reg.</th><th>Name</th><th>Time Slot</th><th>Status</th><th>Change</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}async function load(){let a=await(await fetch('/api/registrations?q='+encodeURIComponent(q.value)+'&status='+encodeURIComponent(f.value))).json();rows.innerHTML=a.map(x=>'<tr><td><b>'+String(x.registration_no).padStart(3,'0')+'</b></td><td>'+esc(x.name)+'</td><td>'+esc(x.time_slot||'—')+'</td><td><span class="badge '+x.status.toLowerCase().replaceAll(' ','-')+'">'+esc(x.status)+'</span></td><td><select onchange="setStatus('+x.registration_no+',this.value)">'+['Registered','Waiting','In Progress','Completed','No Show'].map(s=>'<option '+(s==x.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')}async function setStatus(n,s){await fetch('/api/registration/'+n+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load();stats()}async function stats(){let s=await(await fetch('/api/stats?x='+Date.now())).json();t.textContent=s.total;d.textContent=s.done;p.textContent=s.in_progress;w.textContent=s.waiting}async function logout(){await fetch('/api/logout',{method:'POST'});location='/admin'}load();stats();setInterval(()=>{stats();load()},4000)</script></body></html>
