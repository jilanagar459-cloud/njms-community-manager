<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="center"><div class="card"><div style="font-size:42px">❤️</div><h1>Health Camp Admin</h1><p>Sign in to update member check-up status.</p><input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Sign in</button><div id="e" class="error"></div></div></div><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok)location='/admin';else e.textContent='Invalid password'}</script></body></html>
