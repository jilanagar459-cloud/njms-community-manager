<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check Registration Status</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><div class="eyebrow">27 SEPTEMBER 2026</div><h1>Check Registration Status</h1><div class="sub">Enter your registration number</div></div><a class="link" href="/">Live Dashboard</a></header><main class="narrow"><div class="search"><input id="i" inputmode="numeric" placeholder="Registration No." onkeydown="if(event.key==='Enter')check()"><button onclick="check()">Check Status</button></div><div id="o" class="result hidden"></div><div class="notice">Status updates automatically every 2 seconds.</div></main><script>let last='';function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}async function check(){last=i.value.trim();refresh()}async function refresh(){if(!last)return;let r=await fetch('/api/registration/'+encodeURIComponent(last)+'?x='+Date.now());o.classList.remove('hidden');if(!r.ok){o.innerHTML='<div class="error">Registration number not found.</div>';return}let x=await r.json();o.innerHTML='<div class="eyebrow">REGISTRATION '+String(x.registration_no).padStart(3,'0')+'</div><h2>'+esc(x.name)+'</h2><div class="badge '+x.status.toLowerCase().replaceAll(' ','-')+'">'+esc(x.status)+'</div><p><b>Time Slot:</b> '+esc(x.time_slot||'—')+'</p>'}setInterval(refresh,2000)</script></body></html>
